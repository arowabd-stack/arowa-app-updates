<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ruqyah PWA - Deploy Check</title><style>body{font:16px/1.65 system-ui,sans-serif;margin:25px auto;max-width:660px;padding:0 15px;color:#16452d}article{padding:16px;border-radius:14px;background:#f1f7f2;border:1px solid #d3e5d5}a{color:#196641}strong{display:block;margin:12px 0}button{border:1px solid #9dc1a5;border-radius:8px;background:#fff;padding:10px 16px;color:#16452d}#status{white-space:pre-line}</style></head><body><h1>রুকইয়াহ PWA - ফাইল যাচাই</h1><article><p>PDF ফাইলটি Vercel-এ সঠিকভাবে পৌঁছেছে কি না পরীক্ষা করুন।</p><button id="go">ফাইল পরীক্ষা করুন</button><div id="status" role="status" aria-live="polite"></div><p><a href="./assets/ruqyah-book.pdf#page=68" target="_blank" rel="noopener">PDF-এর ৬৮ নম্বর পৃষ্ঠা খুলুন</a> · <a href="./index.html#chapter-21">মূল রিডার</a></p></article><script>async function check(){const status=document.querySelector('#status');status.textContent='পরীক্ষা চলছে…';const tests=[['PDF','./assets/ruqyah-book.pdf'],['HTML','./index.html'],['Service Worker','./sw.js'],['Manifest','./manifest.webmanifest']];for(const [name,link] of tests){try{const res=await fetch(link,{method:'HEAD',cache:'no-store'});const type=res.headers.get('content-type')||'';status.textContent+='\n'+(res.ok?'✓ ':'✗ ')+name+': HTTP '+res.status+' ('+type+')';}catch(e){status.textContent+='\n✗ '+name+': '+e.message;}}}document.querySelector('#go').onclick=check;check();</script></body></html>
