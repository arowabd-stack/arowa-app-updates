<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f9f4">
<title>রুকইয়াহ — মূল PDF · Canvas Reader</title>
<style>
:root{color-scheme:light;--green:#397652;--bg:#e6ebe6;--muted:#6c806f}
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;padding:0;overflow:hidden}
body{background:var(--bg);font-family:system-ui,'Noto Sans Bengali',sans-serif;color:#25452e}
#app{display:flex;flex-direction:column;width:100%;height:100%;min-height:0;position:relative}
#reader{flex:1 1 auto;width:100%;min-height:0;overflow:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;scrollbar-gutter:stable;touch-action:pan-x pan-y}
#pages{--page-width:640px;min-width:100%;display:flex;flex-direction:column;align-items:center;gap:14px;padding:12px 8px 44px}
.page{position:relative;flex:none;width:var(--page-width);aspect-ratio:585 / 825;background:#fff;box-shadow:0 3px 15px rgba(30,50,35,.15);overflow:hidden;contain:layout paint style}
.page canvas{display:block;width:100%;height:100%;background:white;object-fit:fill}
.page:not(.painted)::before{content:'পৃষ্ঠা ' attr(data-page);position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#7c9582;font:500 15px/1.4 system-ui}
.page.current{outline:1px solid #7da88b55}
#status{position:absolute;z-index:10;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;background:#f7faf7;color:#2a593e;text-align:center}
#status[hidden]{display:none!important}
#status .inner{display:flex;max-width:360px;flex-direction:column;align-items:center;gap:11px;line-height:1.65}
#status strong{font-size:18px}#status span{font-size:13px;color:#607968}
#status a,#status button{border:1px solid #cadbce;background:#fff;color:#2b704b;padding:9px 15px;border-radius:10px;text-decoration:none;font:600 13px system-ui;cursor:pointer}
#status .progress{height:5px;width:min(230px,70vw);border-radius:99px;background:#dde8db;overflow:hidden}
#status .progress>div{height:100%;background:#51936e;width:10%;transition:width .2s}
#hud{position:absolute;z-index:4;right:15px;bottom:13px;display:flex;align-items:center;gap:7px;border:1px solid #dbe7d9;border-radius:999px;background:#f9fcf9ec;box-shadow:0 3px 16px #254a2e28;padding:5px 7px;user-select:none}
#hud button{height:32px;min-width:35px;border:0;border-radius:999px;background:#e8f1e9;color:#29523c;font:700 19px/1 system-ui;cursor:pointer}
#hud button:focus-visible{outline:2px solid #548e62}
#hud .pct{font:700 11px system-ui;color:#365a40;min-width:37px;text-align:center}
#hud .badge{padding:0 8px;font:600 11px system-ui;color:#647b69;border-right:1px solid #d3e0d2}
@media(max-width:700px){#pages{gap:8px;padding:6px 2px 35px}.page{box-shadow:0 1px 5px #273e2725}#hud{bottom:9px;right:9px;padding:3px 4px;gap:3px}#hud button{height:29px;min-width:30px;font-size:17px}#hud .badge{padding:0 6px;font-size:10px}}
</style>
</head>
<body>
<div id="app">
  <div id="status" role="status" aria-live="polite"><div class="inner"><strong id="statusTitle">PDF রিডার প্রস্তুত হচ্ছে…</strong><span id="statusText">মূল বইটি একবার লোড হলে পৃষ্ঠা পরিবর্তন হবে তাৎক্ষণিক।</span><div class="progress"><div id="progressBar"></div></div><button id="retry" type="button" hidden>আবার চেষ্টা করুন</button><a href="./assets/ruqyah-book.pdf" target="_blank" rel="noopener">মূল PDF খুলুন</a></div></div>
  <div id="reader" role="region" aria-label="মূল PDF, টাচ ও মাউস দিয়ে স্ক্রল করুন" tabindex="0"><div id="pages"></div></div>
  <div id="hud" aria-label="বইয়ের Zoom"><span class="badge" id="pageBadge">১ / ২৭২</span><button id="zoomOut" title="ছোট করুন" aria-label="Zoom out">−</button><span class="pct" id="zoomLevel">100%</span><button id="zoomIn" title="বড় করুন" aria-label="Zoom in">+</button></div>
</div>
<script>
(()=>{'use strict';
// This is a custom PDF.js CANVAS viewer. There is no native browser PDF iframe.
// It loads the file once; page requests only paint canvases from that document.
const reader=document.getElementById('reader');
const container=document.getElementById('pages');
const status=document.getElementById('status');
const statusTitle=document.getElementById('statusTitle');
const statusText=document.getElementById('statusText');
const progressBar=document.getElementById('progressBar');
const retry=document.getElementById('retry');
const badge=document.getElementById('pageBadge');
const zoomLabel=document.getElementById('zoomLevel');
const pdfUrl=new URL('./assets/ruqyah-book.pdf',document.baseURI).href;
const allowedOrigin=location.origin==='null'?'*':location.origin;
const TOTAL=272;
const bn=n=>String(n).replace(/\d/g,d=>String.fromCharCode(0x09e6+Number(d)));
const clamp=n=>Math.max(1,Math.min(TOTAL,Math.floor(Number(n)||1)));
const scripts=[
  ['https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js','https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'],
  ['https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js','https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js']
];
let pdf=null,loadPromise=null,current=1,pendingPage=1,zoom=1,baseW=585,baseH=825,epoch=0,painting=0,raf=0,scrollLock=false;
const rendered=new Map(),waiting=new Set(),queue=[];
const MAX_CONCURRENT=2;
const slots=[];
let liveRenders=new Set();
const stats={pdfDownloads:0,opens:0,navigations:0,painted:0,scriptLoads:0};
window.RuqyahPDFViewerDebug=stats;
function notify(type,data={}){try{window.parent.postMessage({source:'ruqyah-custom-pdf-v32',type,...data},allowedOrigin)}catch(_){}}
function setStatus(title,msg,failed=false){status.hidden=false;statusTitle.textContent=title;statusText.textContent=msg;retry.hidden=!failed;progressBar.style.width=failed?'100%':'8%';}
function setPage(n,notifyParent=true){
 n=clamp(n);if(current===n&&badge.textContent===`${bn(n)} / ${bn(TOTAL)}`)return;
 current=n;badge.textContent=`${bn(n)} / ${bn(TOTAL)}`;
 for(const el of container.querySelectorAll('.page.current'))el.classList.remove('current');
 slots[n-1]?.classList.add('current');
 if(notifyParent)notify('page',{page:n});
}
function loadScript(url){return new Promise((resolve,reject)=>{
 const s=document.createElement('script');s.src=url;s.async=true;s.crossOrigin='anonymous';
 const timer=setTimeout(()=>{s.remove();reject(new Error('PDF.js load timeout'))},13000);
 s.onload=()=>{clearTimeout(timer);stats.scriptLoads++;resolve()};
 s.onerror=()=>{clearTimeout(timer);s.remove();reject(new Error('PDF.js unavailable'))};
 document.head.append(s);
})}
async function getPdfJS(){
 if(window.pdfjsLib)return window.pdfjsLib;
 let error;
 for(const [url,worker] of scripts){try{await loadScript(url);if(window.pdfjsLib){window.pdfjsLib.GlobalWorkerOptions.workerSrc=worker;return window.pdfjsLib;}}catch(e){error=e;}}
 throw error||new Error('PDF.js could not be loaded');
}
function createSlots(){
 if(slots.length)return;
 const frag=document.createDocumentFragment();
 for(let i=1;i<=TOTAL;i++){
  const e=document.createElement('section');e.className='page';e.dataset.page=String(i);
  e.setAttribute('aria-label','পৃষ্ঠা '+bn(i));e.style.aspectRatio=`${baseW} / ${baseH}`;
  slots.push(e);frag.append(e);
 }
 container.append(frag);
}
function availableWidth(){
 const width=Math.max(220,reader.clientWidth-18);
 return Math.min(1100,width)*zoom;
}
function updateSize(){
 const width=Math.round(availableWidth());
 container.style.setProperty('--page-width',width+'px');
 container.style.minWidth=(width+14)+'px';
 for(const e of slots)e.style.aspectRatio=`${baseW} / ${baseH}`;
}
function getVisiblePage(){
 if(!slots.length)return current;
 const pos=reader.scrollTop+Math.min(reader.clientHeight*.33,150);
 let left=0,right=slots.length-1;
 while(left<right){const mid=(left+right+1)>>1;if(slots[mid].offsetTop<=pos)left=mid;else right=mid-1;}
 return left+1;
}
function destroyFar(center){
 for(const [n,c] of rendered){if(Math.abs(n-center)>3){c.remove();rendered.delete(n);slots[n-1]?.classList.remove('painted')}}
}
function addToQueue(n){
 if(!pdf||n<1||n>TOTAL||rendered.has(n)||waiting.has(n)||queue.includes(n))return;
 queue.push(n);flushQueue();
}
function schedule(n){
 if(!pdf)return;
 // Jumping to a distant page always prioritizes the selected page over old work.
 queue.length=0;
 addToQueue(n);addToQueue(n+1);addToQueue(n-1);addToQueue(n+2);addToQueue(n-2);
 destroyFar(n);
}
function flushQueue(){
 if(!pdf)return;
 while(painting<MAX_CONCURRENT&&queue.length){
  const n=queue.shift();if(rendered.has(n)||waiting.has(n))continue;
  painting++;waiting.add(n);
  const myEpoch=epoch;
  (async()=>{
   const page=await pdf.getPage(n);
   if(myEpoch!==epoch)return;
   const cssWidth=availableWidth();
   const ratio=Math.min(1.65,Math.max(1,window.devicePixelRatio||1));
   const vp0=page.getViewport({scale:1});
   const viewport=page.getViewport({scale:cssWidth*ratio/vp0.width});
   const canvas=document.createElement('canvas');
   canvas.width=Math.ceil(viewport.width);canvas.height=Math.ceil(viewport.height);
   canvas.style.width='100%';canvas.style.height='100%';
   const context=canvas.getContext('2d',{alpha:false});
   if(!context)throw new Error('Canvas unavailable');
   const job=page.render({canvasContext:context,viewport,background:'#fff'});
   liveRenders.add(job);
   try{await job.promise;}finally{liveRenders.delete(job);}
   if(myEpoch!==epoch)return;
   slots[n-1]?.append(canvas);slots[n-1]?.classList.add('painted');rendered.set(n,canvas);stats.painted++;
  })().catch(e=>{if(!/cancel/i.test(String(e)))console.warn('PDF page render',n,e)}).finally(()=>{waiting.delete(n);painting--;flushQueue()});
 }
}
function cancelPaints(){
 epoch++;queue.length=0;for(const task of liveRenders){try{task.cancel()}catch(_){}}
 rendered.forEach(canvas=>canvas.remove());rendered.clear();waiting.clear();
 slots.forEach(e=>e.classList.remove('painted'));
}
function navigate(n){
 n=clamp(n);pendingPage=n;stats.navigations++;
 setPage(n);notify('navigation',{page:n});
 if(!pdf){loadPDF().catch(()=>{});return;}
 scrollLock=true;reader.scrollTo({top:slots[n-1].offsetTop,behavior:'instant'});
 schedule(n);requestAnimationFrame(()=>{scrollLock=false;setPage(n)});
}
function zoomTo(value){
 const next=Math.max(.7,Math.min(2.25,Math.round(value*100)/100));
 if(Math.abs(next-zoom)<.01)return;
 zoom=next;zoomLabel.textContent=Math.round(zoom*100)+'%';
 if(!pdf)return;
 const keep=current;cancelPaints();updateSize();
 requestAnimationFrame(()=>{reader.scrollTop=slots[keep-1].offsetTop;schedule(keep)});
 notify('zoom',{zoom});
}
async function loadPDF(){
 if(pdf)return pdf;
 if(loadPromise)return loadPromise;
 setStatus('PDF রিডার চালু হচ্ছে…','বইটি প্রথমবার একবার ডাউনলোড হবে। এরপর পৃষ্ঠায় যেতে আর রিলোড হবে না।');
 loadPromise=(async()=>{
   const lib=await getPdfJS();
   stats.pdfDownloads++;
   const response=await fetch(pdfUrl,{cache:'default'});
   if(!response.ok)throw new Error('PDF HTTP '+response.status);
   const bytes=await response.arrayBuffer();
   if(bytes.byteLength<100000||new TextDecoder().decode(bytes.slice(0,5))!=='%PDF-')throw new Error('Invalid PDF asset');
   progressBar.style.width='70%';
   // Only ONE getDocument call. Never reset src or navigate to pdfUrl#page=N.
   const task=lib.getDocument({data:new Uint8Array(bytes),isEvalSupported:false});
   pdf=await task.promise;stats.opens++;
   if(pdf.numPages!==TOTAL)throw new Error('Expected 272 pages; got '+pdf.numPages);
   const first=await pdf.getPage(1),vp=first.getViewport({scale:1});baseW=vp.width;baseH=vp.height;
   createSlots();updateSize();status.hidden=true;
   notify('ready',{page:current,pages:TOTAL});
   const initial=pendingPage;navigate(initial);
   return pdf;
 })().catch(e=>{
   console.error('Ruqyah custom PDF renderer:',e);
   pdf=null;
   const details=/404/.test(String(e))?'Vercel-এ assets/ruqyah-book.pdf ফাইলটি পাওয়া যায়নি।':'প্রথমবার PDF.js চালাতে ইন্টারনেট প্রয়োজন। সংযোগ বা Vercel ফাইল যাচাই করুন।';
   setStatus('PDF রিডার চালু হয়নি',details+' '+String(e?.message||e),true);
   notify('error',{message:String(e?.message||e)});
   throw e;
 }).finally(()=>{loadPromise=null});
 return loadPromise;
}
document.getElementById('retry').addEventListener('click',()=>loadPDF().catch(()=>{}));
document.getElementById('zoomIn').addEventListener('click',()=>zoomTo(zoom+.2));
document.getElementById('zoomOut').addEventListener('click',()=>zoomTo(zoom-.2));
reader.addEventListener('scroll',()=>{
 if(raf)return;raf=requestAnimationFrame(()=>{
  raf=0;if(!pdf||scrollLock)return;
  const p=getVisiblePage();if(p!==current)setPage(p);schedule(p);
 });
},{passive:true});
let resizeTimer=0;
const resize=()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(()=>{
 if(!pdf)return;const keep=current;cancelPaints();updateSize();
 requestAnimationFrame(()=>{reader.scrollTop=slots[keep-1].offsetTop;schedule(keep)});
},150)};
if('ResizeObserver'in window)new ResizeObserver(resize).observe(reader);
else window.addEventListener('resize',resize,{passive:true});
window.addEventListener('message',event=>{
 if(event.source!==window.parent)return;
 if(allowedOrigin!=='*'&&event.origin!==allowedOrigin)return;
 const data=event.data;
 if(!data||data.source!=='ruqyah-pwa-parent-v32')return;
 if(data.type==='goto')navigate(data.page);
 if(data.type==='zoom')zoomTo(data.zoom);
 if(data.type==='where')notify('page',{page:current});
});
// Keyboard navigation when directly reading standalone.
reader.addEventListener('keydown',event=>{
 if(event.key==='PageDown'){event.preventDefault();navigate(current+1)}
 if(event.key==='PageUp'){event.preventDefault();navigate(current-1)}
});
// Standalone debug and direct links: /book-reader.html?page=68.
window.RuqyahPDFGoToPage=navigate;
const fromURL=new URL(location.href).searchParams.get('page');
if(fromURL)pendingPage=clamp(fromURL);
notify('boot',{version:'v32',page:pendingPage});
loadPDF().catch(()=>{});
})();
</script>
</body>
</html>
